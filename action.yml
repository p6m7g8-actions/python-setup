name: "P6 GHA: Setups Python"
description: "P6 GHA: Setups Python"
author: "Philip M. Gollucci"

inputs:
  python-version:
    description: "Python version to install (e.g., 3.14.3)"
    required: false
    default: "3.14.3"

runs:
  using: "composite"
  steps:
    - name: Install Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check Python
      shell: bash
      run: |
        set +e
        which python
        which pip
        python -V
        pip -V
        echo "$PATH"

    - name: Install uv
      shell: bash
      run: |
        if [ -e uv.lock ]; then
          pip install uv
        else
          echo "::warning title=No uv.lock found::No uv.lock in $(pwd); skipping uv and dependency install."
          echo "python-setup installed Python only; no project dependencies were installed."
          echo "If you expected dependencies to be installed:"
          echo "  * check out the repository before this action runs, and"
          echo "  * commit a uv.lock (generate one with 'uv lock')."
        fi

    - name: Check uv
      shell: bash
      run: |
        if [ -e uv.lock ]; then
          set +e
          which uv
          uv --version
          uv run which python
          uv run python -V
        else
          echo "Skipping uv checks: no uv.lock (see the warning above)."
        fi

    - name: Install deps
      shell: bash
      run: |
        if [ -e uv.lock ]; then
          uv sync --dev
        else
          echo "Skipping 'uv sync --dev': no uv.lock (see the warning above)."
        fi
